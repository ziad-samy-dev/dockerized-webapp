name: dockerized-webapp

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webapp}
      POSTGRES_USER: ${POSTGRES_USER:-webapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webapp} -d ${POSTGRES_DB:-webapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Flask application ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webapp}
      POSTGRES_USER: ${POSTGRES_USER:-webapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy

  # ---------- Nginx reverse proxy (the only container with published ports) ----------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db_data:
